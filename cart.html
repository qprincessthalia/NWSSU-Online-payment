<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart - NWSSU</title>

    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/student-header.css">
</head>

<body>

    <!-- HEADER -->
    <header class="navbar">

        <div class="brand">
            <img src="photos/nwssu-logo.png" alt="NWSSU Logo">
            <span>NWSSU</span>
        </div>

        <nav>
            <a href="student-dashboard.html">Dashboard</a>
            <a href="payment-catalog.html">Catalog</a>
            <a href="cart.html" class="active">Cart</a>
           
        </nav>

    </header>

    <!-- MAIN CONTENT -->
    <main>

        <section class="cart-heading">
            <h1>My Cart</h1>
            <p>Review your selected school items.</p>
        </section>

        <!-- CART ITEMS -->
        <section class="cart-list" id="cartList" aria-live="polite"></section>

        <!-- TOTAL -->
        <section class="cart-total">
            <h3>
                Total Amount:
                <span id="cartTotal">₱0.00</span>
            </h3>
        </section>

        <!-- CART ACTION BUTTONS -->
        <div class="cart-actions">

            <a href="payment-catalog.html" class="back-button">
                ← Continue Shopping
            </a>

            <a href="payment.html" class="payment-button disabled" id="checkoutButton" aria-disabled="true">
                Make Payment →
            </a>

        </div>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Northwest Samar State University | Online Payment System</p>
    </footer>

    <script src="js/payment-store.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/student-session.js"></script>
</body>
</html>
